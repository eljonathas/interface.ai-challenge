[project]
name = "interface-ai-challenge"
version = "0.1.0"
description = "Computer-use discovery compiled into deterministic, replayable capabilities for legacy back-office UIs"
readme = "README.md"
authors = [
    { name = "Jonathas Andrade", email = "jonathas.andrade5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
cua = "interface_ai_challenge.cli:app"
interface-ai-challenge = "interface_ai_challenge.cli:app"

[project.optional-dependencies]
discovery = [
    "openai>=3.13.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["browser: needs a local Chromium started by Playwright"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/interface_ai_challenge/adapters/openai_agent.py" = ["E501"]
"src/interface_ai_challenge/adapters/playwright/dom_scripts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
