<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Legacy Credit Union Desk</title>
<style>
  body { font-family: "Times New Roman", Times, serif; font-size: 16px; background: #efece2; color: #111; margin: 10px; }
  h3 { margin: 4px 0 10px; }
  table.grid { border-collapse: collapse; background: #fff; }
  table.grid td, table.grid th { border: 1px solid #8c8c8c; padding: 5px 12px; }
  table.grid th { background: #cbc4ad; text-align: left; }
  .msg { color: #8a1c1c; font-weight: bold; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
